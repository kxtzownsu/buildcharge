name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag base (e.g. v1.2.3)'
        required: true
        type: string

jobs:
  # we do this because both `package` & `release` use these vars, so it needs to be global.
  setup:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.set.outputs.projects }}
      arches: ${{ steps.set.outputs.arches }}
    steps:
      - id: set
        run: |
          echo 'projects=["buildcharge"]' >> "$GITHUB_OUTPUT"
          echo 'arches=["x86_64","aarch64"]' >> "$GITHUB_OUTPUT"

  package:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ${{ fromJSON(needs.setup.outputs.projects) }}
        arch: ${{ fromJSON(needs.setup.outputs.arches) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download ${{ matrix.project }}-${{ matrix.arch }}
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          branch: main
          workflow_conclusion: success
          name: ${{ matrix.project }}-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}

      - name: Zip
        run: |
          cd dist
          zip -r ${{ matrix.project }}-${{ matrix.arch }}.zip ${{ matrix.arch }}/

      - name: Upload zipped artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.project }}-${{ matrix.arch }}
          path: dist/${{ matrix.project }}-${{ matrix.arch }}.zip

  release:
    needs: [setup, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        project: ${{ fromJSON(needs.setup.outputs.projects) }}
    steps:
      - name: Download all ZIPs for this project
        uses: actions/download-artifact@v4
        with:
          pattern: release-${{ matrix.project }}-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}-${{ matrix.project }}
          name: ${{ inputs.tag }} (${{ matrix.project }})
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*.zip